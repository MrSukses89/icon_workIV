<meta charset="UTF-8">
<!-- Supaya ukuran mengikuti layar HP -->
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Digital Hub</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Poppins -->
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
    rel="stylesheet">
<!-- CSS Custom -->
<link rel="stylesheet" href="css/01.CSS">
<style>
    /* =====================================
       RESET DASAR
    ===================================== */
    * {
        box-sizing: border-box;
    }
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }
    /* =====================================
       HALAMAN UTAMA
    ===================================== */
    body {
        font-family:
            "Poppins",
            sans-serif;
        width: 100vw;
        /*
        Mengikuti tinggi layar HP.
        100dvh lebih akurat saat dibuka
        menggunakan Chrome Android.
        */
        min-height: 100vh;
        min-height: 100dvh;
        color: white;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-text-size-adjust: 100%;
    }
    /* =====================================
       WALLPAPER
    ===================================== */
    #wallpaper {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-size: cover;

        background-position: center;

        background-repeat: no-repeat;

        z-index: 0;

        transform: scale(1.03);

        transition:
            background-image
            1s
            ease-in-out;

    }


    /* =====================================
       KONTEN UTAMA
    ===================================== */

    .digital-content {

        position: relative;

        z-index: 10;

        width: 100%;

        /*
        Lebar maksimal untuk HP.
        Jika layar lebih lebar,
        konten tetap terlihat rapi.
        */

        max-width: 430px;

        min-height: 100vh;

        min-height: 100dvh;

        margin:
            0
            auto;

        /*
        Padding dibuat lebih kecil
        agar cocok untuk layar 7,5 x 16 cm.
        */

        padding-top:

            max(
                18px,
                env(safe-area-inset-top)
            );

        padding-right: 14px;

        padding-bottom:

            max(
                18px,
                env(safe-area-inset-bottom)
            );

        padding-left: 14px;


        display: flex;

        flex-direction: column;

        justify-content: center;

    }


    /* =====================================
       PEMBUNGKUS MENU
    ===================================== */

    .menu-wrapper {

        width: 100%;

    }


    /* =====================================
       HEADER
    ===================================== */

    .digital-header {

        margin-top: 0;

        margin-bottom: 24px;

    }


    .header-title {

        font-size: 30px;

        line-height: 1.1;

    }


    /* =====================================
       MENU UTAMA
    ===================================== */

    main {

        gap: 12px !important;

    }


    /*
    Tinggi menu dibuat lebih pendek
    supaya semua menu pas di layar HP.
    */

    .menu-card {

        min-height: 72px;

        padding: 13px !important;

        gap: 13px !important;

    }


    /*
    Ukuran kotak ikon.
    */

    .menu-card > div:first-child {

        padding: 10px !important;

        flex-shrink: 0;

    }


    /*
    Ukuran ikon.
    */

    .menu-card svg {

        width: 25px !important;

        height: 25px !important;

    }


    /*
    Judul menu.
    */

    .menu-card h2 {

        font-size: 15px !important;

        line-height: 1.25;

    }


    /*
    Deskripsi menu.
    */

    .menu-card p {

        font-size: 11px !important;

        line-height: 1.4;

    }


    /* =====================================
       FOOTER
    ===================================== */

    .digital-footer {

        margin-top: 20px;

    }


    .digital-footer p {

        font-size: 9px !important;

    }


    /* =====================================
       TOMBOL WALLPAPER
    ===================================== */

    #btnWallpaper {

        /*
        Posisi aman dari bagian atas HP.
        */

        top:

            max(
                12px,
                env(safe-area-inset-top)
            ) !important;

        right: 12px !important;

        padding:

            8px
            11px !important;

        font-size: 10px !important;

    }


    #btnWallpaper svg {

        width: 14px !important;

        height: 14px !important;

    }


    /* =====================================
       HP DENGAN LEBAR KECIL
    ===================================== */

    @media
    (max-width: 380px) {

        .digital-content {

            padding-left: 10px;

            padding-right: 10px;

        }


        .header-title {

            font-size: 27px;

        }


        .digital-header {

            margin-bottom: 19px;

        }


        main {

            gap: 10px !important;

        }


        .menu-card {

            min-height: 67px;

            padding: 11px !important;

            gap: 11px !important;

        }


        .menu-card > div:first-child {

            padding: 9px !important;

        }


        .menu-card svg {

            width: 23px !important;

            height: 23px !important;

        }


        .menu-card h2 {

            font-size: 14px !important;

        }


        .menu-card p {

            font-size: 10px !important;

        }


        .digital-footer {

            margin-top: 16px;

        }


    }


    /* =====================================
       HP DENGAN LAYAR PENDEK
    ===================================== */

    @media
    (max-height: 700px) {

        .digital-content {

            justify-content: flex-start;

            padding-top: 70px;

        }


        .digital-header {

            margin-bottom: 18px;

        }


        .header-title {

            font-size: 26px;

        }


        main {

            gap: 9px !important;

        }


        .menu-card {

            min-height: 62px;

            padding: 10px !important;

        }


        .digital-footer {

            margin-top: 14px;

        }

    }


    /* =====================================
       TABLET DAN DESKTOP
    ===================================== */

    @media
    (min-width: 600px) {

        body {

            display: flex;

            justify-content: center;

            align-items: center;

            background: #020617;

        }


        .digital-content {

            width: 100%;

            max-width: 430px;

            min-height: 720px;

            max-height: 90vh;

            border-radius: 28px;

            overflow: hidden;

        }


        #wallpaper {

            transform: scale(1.05);

        }

    }

</style>
