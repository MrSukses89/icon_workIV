<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Music Player</title>

src="https://unpkg.com/@phosphor-icons/web">
</script>


<style>


/* =====================================
   1. RESET
===================================== */

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

  font-family:

    Arial,
    sans-serif;

}


html,
body {

  width: 100%;

  height: 100%;

  overflow: hidden;

  background:

    #0f172a;

}


/* =====================================
   2. MUSIC PLAYER
===================================== */

.music-player {

  width: 100%;

  height: 100vh;

  height: 100dvh;

  display: flex;

  flex-direction: column;

  background:

    #1e293b;

  color:

    white;

  overflow: hidden;

}


/* =====================================
   3. BAGIAN ATAS PLAYER
===================================== */

.player-top {

  flex-shrink: 0;

  padding:

    max(
      14px,
      env(safe-area-inset-top)
    )

    16px

    10px;

  background:

    #1e293b;

  z-index:

    10;

}


/* =====================================
   4. HEADER
===================================== */

.header {

  display: flex;

  justify-content:

    space-between;

  align-items:

    center;

  margin-bottom:

    8px;

}


.header h2 {

  font-size:

    12px;

  color:

    #94a3b8;

  letter-spacing:

    2px;

}


.icon-button {

  border:

    none;

  background:

    transparent;

  color:

    #94a3b8;

  font-size:

    24px;

}


/* =====================================
   5. COVER
===================================== */

.cover-container {

  width:

    150px;

  height:

    150px;

  margin:

    0
    auto
    8px;

  position:

    relative;

  display:

    flex;

  justify-content:

    center;

  align-items:

    center;

}


/* COVER BERBENTUK PIRINGAN */

.cover {

  width:

    135px;

  height:

    135px;

  border-radius:

    50%;

  object-fit:

    cover;

  border:

    5px
    solid
    #334155;

  box-shadow:

    0
    0
    25px

    rgba(
      56,
      189,
      248,
      0.25
    );

  animation:

    putarCover

    8s

    linear

    infinite;

  animation-play-state:

    paused;

}


/* COVER BERPUTAR SAAT PLAY */

.music-player.playing
.cover {

  animation-play-state:

    running;

}


/* ANIMASI */

@keyframes putarCover {

  from {

    transform:

      rotate(
        0deg
      );

  }


  to {

    transform:

      rotate(
        360deg
      );

  }

}


/* IKON MUSIK */

.music-icon {

  position:

    absolute;

  width:

    44px;

  height:

    44px;

  border-radius:

    50%;

  background:

    #0f172a;

  border:

    3px
    solid
    #38bdf8;

  display:

    flex;

  justify-content:

    center;

  align-items:

    center;

  color:

    #38bdf8;

  font-size:

    23px;

  pointer-events:

    none;

}


/* =====================================
   6. INFO LAGU
===================================== */

.song-info {

  text-align:

    center;

}


.song-title {

  font-size:

    18px;

  font-weight:

    bold;

  white-space:

    nowrap;

  overflow:

    hidden;

  text-overflow:

    ellipsis;

}


.artist {

  margin-top:

    3px;

  font-size:

    13px;

  color:

    #94a3b8;

}


/* =====================================
   7. PROGRESS
===================================== */

.progress {

  width:

    100%;

  height:

    6px;

  margin-top:

    12px;

  background:

    #334155;

  border-radius:

    10px;

  overflow:

    hidden;

  cursor:

    pointer;

}


.progress-fill {

  width:

    0%;

  height:

    100%;

  background:

    #38bdf8;

}


.time {

  display:

    flex;

  justify-content:

    space-between;

  margin-top:

    5px;

  font-size:

    11px;

  color:

    #94a3b8;

}


/* =====================================
   8. TOMBOL KONTROL
===================================== */

.controls {

  display:

    flex;

  justify-content:

    center;

  align-items:

    center;

  gap:

    20px;

  margin-top:

    6px;

}


.control-button {

  border:

    none;

  background:

    transparent;

  color:

    white;

  font-size:

    26px;

  cursor:

    pointer;

}


.play-button {

  width:

    58px;

  height:

    58px;

  border:

    none;

  border-radius:

    50%;

  background:

    #38bdf8;

  color:

    #0f172a;

  font-size:

    28px;

  cursor:

    pointer;

}


/* =====================================
   9. PREVIOUS DAN NEXT
===================================== */

.text-controls {

  display:

    flex;

  gap:

    10px;

  margin-top:

    8px;

}


.text-controls button {

  flex:

    1;

  padding:

    9px;

  border:

    1px
    solid
    #475569;

  border-radius:

    10px;

  background:

    #334155;

  color:

    white;

  cursor:

    pointer;

}


/* =====================================
   10. VOLUME
===================================== */

.volume {

  display:

    flex;

  align-items:

    center;

  gap:

    10px;

  margin-top:

    8px;

  padding:

    8px
    14px;

  border-radius:

    20px;

  background:

    #0f172a;

}


.volume input {

  width:

    100%;

}


/* =====================================
   11. PLAYLIST
===================================== */

.playlist-area {

  flex:

    1;

  min-height:

    0;

  display:

    flex;

  flex-direction:

    column;

  border-top:

    1px
    solid
    #334155;

  padding:

    10px
    16px;

  overflow:

    hidden;

}


.playlist-title {

  flex-shrink:

    0;

  margin-bottom:

    7px;

  font-size:

    12px;

  color:

    #94a3b8;

  letter-spacing:

    1px;

}


/* =====================================
   12. LIST LAGU DI-SCROLL
===================================== */

.song-list {

  flex:

    1;

  min-height:

    0;

  overflow-y:

    auto;

  overflow-x:

    hidden;

  padding-right:

    5px;

  -webkit-overflow-scrolling:

    touch;

}


.song-list::-webkit-scrollbar {

  width:

    5px;

}


.song-list::-webkit-scrollbar-thumb {

  background:

    #475569;

  border-radius:

    10px;

}


/* ITEM LAGU */

.song-item {

  display:

    flex;

  justify-content:

    space-between;

  align-items:

    center;

  padding:

    11px;

  margin-bottom:

    5px;

  border-radius:

    10px;

  background:

    #263449;

  cursor:

    pointer;

}


.song-item.active {

  background:

    #334155;

  border-left:

    4px
    solid
    #38bdf8;

}


.song-item-title {

  font-size:

    14px;

  font-weight:

    bold;

}


.song-item-artist {

  margin-top:

    3px;

  font-size:

    12px;

  color:

    #94a3b8;

}


/* =====================================
   13. HP LAYAR PENDEK
===================================== */

@media
(max-height: 700px) {

  .cover-container {

    width:

      110px;

    height:

      110px;

  }


  .cover {

    width:

      100px;

    height:

      100px;

  }


  .player-top {

    padding-top:

      8px;

    padding-bottom:

      6px;

  }


  .progress {

    margin-top:

      7px;

  }


  .controls {

    margin-top:

      4px;

  }


  .play-button {

    width:

      50px;

    height:

      50px;

  }

}


/* =====================================
   14. DESKTOP
===================================== */

@media
(min-width: 600px) {

  body {

    display:

      flex;

    justify-content:

      center;

    align-items:

      center;

    padding:

      20px;

  }


  .music-player {

    width:

      430px;

    max-height:

      850px;

    border-radius:

      28px;

    box-shadow:

      0
      20px
      50px

      rgba(
        0,
        0,
        0,
        0.5
      );

  }

}


</style>

/* =====================================
   VARIABEL
===================================== */

const audio =

new Audio();


const player =

document.querySelector(

".music-player"

);


const title =

document.getElementById(

"title"

);


const artist =

document.getElementById(

"artist"

);


const cover =

document.getElementById(

"cover"

);


const play =

document.getElementById(

"play"

);


const previous =

document.getElementById(

"previous"

);


const next =

document.getElementById(

"next"

);


const songList =

document.getElementById(

"songList"

);


const progress =

document.getElementById(

"progress"

);


const progressFill =

document.getElementById(

"progressFill"

);


const currentTime =

document.getElementById(

"currentTime"

);


const duration =

document.getElementById(

"duration"

);


const volume =

document.getElementById(

"volume"

);


let currentSong =

0;


/* =====================================
   LOAD LAGU
===================================== */

function loadSong(

index

) {


const song =

playlist[index];


audio.src =

song.src;


title.textContent =

song.title;


artist.textContent =

song.artist;


cover.src =

song.cover;


progressFill.style.width =

"0%";


currentTime.textContent =

"0:00";


duration.textContent =

"0:00";


renderPlaylist();


}


/* =====================================
   PLAY
===================================== */

function playSong() {


audio.play()

.then(

function() {


player.classList.add(

"playing"

);


play.innerHTML =

'<i class="ph ph-pause-fill"></i>';


}

)

.catch(

function(error) {


console.log(

"Musik tidak dapat diputar:",

error

);


}

);


}


/* =====================================
   PAUSE
===================================== */

function pauseSong() {


audio.pause();


player.classList.remove(

"playing"

);


play.innerHTML =

'<i class="ph ph-play-fill"></i>';


}


/* =====================================
   TOMBOL PLAY
===================================== */

play.addEventListener(

"click",

function() {


if (

audio.paused

) {


playSong();


}

else {


pauseSong();


}


}

);


/* =====================================
   NEXT
===================================== */

function nextSong() {


currentSong++;


if (

currentSong >=

playlist.length

) {


currentSong =

0;


}


loadSong(

currentSong

);


playSong();


}


/* =====================================
   PREVIOUS
===================================== */

function previousSong() {


currentSong--;


if (

currentSong <

0

) {


currentSong =

playlist.length - 1;


}


loadSong(

currentSong

);


playSong();


}


/* =====================================
   EVENT BUTTON
===================================== */

next.onclick =

nextSong;


previous.onclick =

previousSong;


document

.getElementById(

"nextText"

)

.onclick =

nextSong;


document

.getElementById(

"previousText"

)

.onclick =

previousSong;


/* =====================================
   BUAT PLAYLIST
===================================== */

function renderPlaylist() {


songList.innerHTML =

"";


playlist.forEach(

function(

song,

index

) {


const item =

document.createElement(

"div"

);


item.className =

"song-item";


if (

index ===

currentSong

) {


item.classList.add(

"active"

);


}


item.innerHTML =

`

<div>

<div

class="song-item-title">

${song.title}

</div>

<div

class="song-item-artist">

${song.artist}

</div>

</div>

<i

class="ph ph-music-note">

</i>

`;


item.onclick =

function() {


currentSong =

index;


loadSong(

currentSong

);


playSong();


};


songList.appendChild(

item

);


}

);


}


/* =====================================
   PROGRESS
===================================== */

audio.addEventListener(

"timeupdate",

function() {


if (

audio.duration

) {


const percent =

(

audio.currentTime /

audio.duration

)

*

100;


progressFill.style.width =

percent +

"%";


currentTime.textContent =

formatTime(

audio.currentTime

);


duration.textContent =

formatTime(

audio.duration

);


}


}

);


/* =====================================
   KLIK PROGRESS
===================================== */

progress.addEventListener(

"click",

function(

event

) {


if (

!audio.duration

) {


return;


}


const rect =

progress.getBoundingClientRect();


const position =

(

event.clientX -

rect.left

)

/

rect.width;


audio.currentTime =

position *

audio.duration;


}

);


/* =====================================
   FORMAT WAKTU
===================================== */

function formatTime(

seconds

) {


const minutes =

Math.floor(

seconds /

60

);


const second =

Math.floor(

seconds %

60

);


return

minutes +

":" +

(

second <

10

?

"0"

:

""

)

+

second;


}


/* =====================================
   VOLUME
===================================== */

volume.oninput =

function() {


audio.volume =

volume.value /

100;


};


/* =====================================
   LAGU SELESAI
===================================== */

audio.onended =

nextSong;


/* =====================================
   MULAI
===================================== */

audio.volume =

0.7;


loadSong(

currentSong

);


</script>
